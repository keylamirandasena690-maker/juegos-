<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Login - SENA</title>

<link rel="stylesheet" href="./estilo.css">
```

</head>

<body>

```
<!-- ==============================
     CONTENEDOR DEL LOGIN
=============================== -->

<main class="login-container">

    <section class="login-box">

        <h1>Iniciar Sesión</h1>

        <form id="loginForm">

            <!-- USUARIO -->
            <div class="input-group">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    required
                    autocomplete="username"
                    placeholder="Ingrese su usuario">

            </div>


            <!-- CONTRASEÑA -->
            <div class="input-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="Ingrese su contraseña">

            </div>


            <!-- BOTÓN -->
            <button
                type="submit"
                class="btn-login">

                Ingresar

            </button>


            <!-- MENSAJE DE ERROR -->
            <p
                id="errorMsg"
                class="error-msg"
                style="display: none;"
                role="alert">

                Usuario o contraseña incorrectos

            </p>

        </form>

    </section>

</main>


<!-- ==============================
     JAVASCRIPT
=============================== -->

<script src="./script.js"></script>
```

</body>

</html>
